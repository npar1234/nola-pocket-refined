<title>NOLA Pocket — Refined</title>

<style>
:root{
  --bg:#f1ece1; --surface:#faf7f0; --raise:#ffffff; --ink:#1b1922; --muted:#6c675b; --rule:#d9d1bf;
  --brass:#8d6a1b; --brass-soft:#ead9ae; --brass-ink:#5a4310; --ok:#2e5d3a; --ok-soft:#d3e5d4; --skip:#8a3a2e; --skip-soft:#efd6d0;
  --font-display:'Bebas Neue','Oswald','Impact',sans-serif; --font-body:'Instrument Sans','Helvetica Neue',sans-serif; --font-mono:'DM Mono',Menlo,monospace;
  --r:10px; --tab-h:64px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d0c15; --surface:#15131f; --raise:#1d1a29; --ink:#f1eadb; --muted:#a49d8c; --rule:#2a2637;
  --brass:#d6ab4c; --brass-soft:#3b3015; --brass-ink:#f3d58c; --ok:#8fd2a1; --ok-soft:#1a3324; --skip:#e59a88; --skip-soft:#3a1f1a;
}}
:root[data-theme="dark"]{
  --bg:#0d0c15; --surface:#15131f; --raise:#1d1a29; --ink:#f1eadb; --muted:#a49d8c; --rule:#2a2637;
  --brass:#d6ab4c; --brass-soft:#3b3015; --brass-ink:#f3d58c; --ok:#8fd2a1; --ok-soft:#1a3324; --skip:#e59a88; --skip-soft:#3a1f1a;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.45;padding-inline:16px;padding-block:0 calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--brass-ink)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:normal}
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding-block:10px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule)}
.top h1{font-family:var(--font-display);font-size:1.9rem;letter-spacing:.03em;line-height:1}
.top h1 em{font-style:normal;color:var(--brass)}
.top .clock{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-align:right;line-height:1.3}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px 4px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;padding:6px 11px;border:1px solid var(--rule);border-radius:999px;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.on{background:var(--brass-soft);color:var(--brass-ink);border-color:var(--brass-soft)}
.chip b{font-family:var(--font-display);font-size:1rem;letter-spacing:.04em;margin-right:4px;color:inherit;font-weight:normal}
section.view{display:none;padding-top:6px} section.view.on{display:block}
.eyebrow{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin:0 0 6px}
.h2{font-family:var(--font-display);font-size:2rem;letter-spacing:.02em;line-height:1;margin:14px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;font-style:italic}

/* hero (up next) */
.hero{background:var(--raise);border:1px solid var(--rule);border-left:4px solid var(--brass);border-radius:var(--r);padding:14px 14px 12px;margin-top:10px}
.hero .when{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.hero h2{font-family:var(--font-display);font-size:1.9rem;letter-spacing:.02em;line-height:1.02;margin:4px 0 4px}
.hero .where{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);margin:0 0 6px}
.hero p{margin:0;font-size:.95rem}
.dist{font-family:var(--font-mono);font-size:.74rem;color:var(--brass-ink);margin-top:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;padding:9px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);text-decoration:none;min-height:40px}
.btn.primary{background:var(--brass);color:#14110a;border-color:var(--brass)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn.skip{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* stop list */
.stops{list-style:none;margin:8px 0 0;padding:0}
.stop{display:grid;grid-template-columns:56px 1fr auto;gap:0 10px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:start}
.stop .t{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.stop .t small{display:block;font-size:.6rem;letter-spacing:.1em;opacity:.8}
.stop h3{font-size:1.02rem;font-weight:600;line-height:1.25}
.stop .where{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:2px}
.stop .more{display:none;margin-top:6px;font-size:.92rem}
.stop.open .more{display:block}
.stop .tick{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:1rem;color:var(--muted)}
.stop.done h3{text-decoration:line-through;color:var(--muted)}
.stop.done .tick{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.stop.skipped h3{text-decoration:line-through;color:var(--muted)}
.stop.skipped .tick{background:var(--skip-soft);color:var(--skip);border-color:transparent}
.stop.next h3::before{content:"▸ ";color:var(--brass)}
.tag{display:inline-block;font-family:var(--font-mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:.15em;white-space:nowrap}
.tag.booked{background:var(--ok-soft);color:var(--ok)} .tag.book{background:var(--brass-soft);color:var(--brass-ink)} .tag.walk{border:1px solid var(--rule);color:var(--muted)} .tag.custom{background:var(--brass);color:#14110a}
.dress{font-family:var(--font-mono);font-size:.68rem;color:var(--brass);display:block;margin-top:4px}

/* explore */
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:12px;margin-top:8px}
.card h3{font-size:1.02rem;font-weight:600}
.card .why{font-size:.92rem;margin:3px 0 0}
.card .meta{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ask{background:var(--raise);border:1px solid var(--brass-soft);border-radius:var(--r);padding:12px;margin-top:12px}
.ask textarea{width:100%;min-height:64px;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px;font:inherit;font-size:.95rem;resize:vertical}
.ask .out{margin-top:10px;font-size:.95rem;white-space:pre-wrap}
.ask .out .card{margin-top:8px}
.note{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);margin-top:8px;line-height:1.5}

/* book */
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:9px 6px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.when{font-family:var(--font-mono);font-size:.72rem;white-space:nowrap;color:var(--brass-ink)}
td.chk{width:36px}
tr.done td{color:var(--muted);text-decoration:line-through}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-top:10px}
.facts div{background:var(--surface);padding:10px 12px}
.facts small{display:block;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:600}
.facts span{display:block;font-size:.85rem;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--rule);display:flex;z-index:7}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs button .ico{font-family:var(--font-display);font-size:1.35rem;letter-spacing:.02em;line-height:1}
.tabs button.on{color:var(--brass-ink)} .tabs button.on .ico{color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--font-mono);font-size:.74rem;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:8}
.toast.show{opacity:1}
.upd{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);background:var(--brass);color:var(--ink);font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;padding:12px 16px;border-radius:12px;text-align:center;transform:translateY(140%);transition:transform .3s;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.upd.show{transform:none}
.sync{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const DAYS = [{"id":"thu","label":"Thursday","date":"2026-11-05","sub":"Arrive, settle in, and enjoy one music experience.","stay":"nopsi","stops":[{"t":"07:40","tz":"PT","p":null,"title":"LAS → MSY, Southwest","status":"booked","cat":"transit","where":"Conf See private confirmation · nonstop · in at 1:00pm","note":"Early one — out the door around 6. Check the app 48 hours before: A-List gets Extra Legroom free if a row is open.","originalTime":"07:40"},{"t":"13:00","p":"msy","title":"Land MSY","cat":"transit","where":"Taxi $36 flat (Level 1, Door 7) · 20–30 min · use Lyft not Uber ($10/mo card credit + 5x points)","note":"Whole afternoon ahead. Dark by 5, so the outdoor part goes first.","originalTime":"13:00"},{"t":"13:45","p":"nopsi","title":"Drop bags at NOPSI — and make the ask now","status":"booked","cat":"hotel","key":true,"where":"Conf See private confirmation · Deluxe King, 374–498 sq ft · rooms ready at 4","note":"The 1927 New Orleans Public Service headquarters — nine stories, Art Deco, built around daylight. Every room here faces outward, so there is no bad room to get stuck in. At bag drop say it’s Malinda’s 50th and ask for a high floor away from Baronne. Your rate carries a $50 hotel credit and $20/person breakfast credit daily — use them.","originalTime":"13:45"},{"t":"14:30","p":"central","title":"Muffuletta at Central Grocery, eaten on the river","status":"walk","cat":"food","key":true,"where":"923 Decatur · ~20-min walk through the Quarter","note":"Since 1906, and the sandwich was invented there. Get a half between you — a whole feeds three — and carry it across Decatur to the Moon Walk to eat looking at the Mississippi. This is also your orientation walk.","originalTime":"14:30"},{"t":"16:00","p":null,"title":"Walk back up Royal Street","status":"walk","cat":"see","where":"Galleries, antique shops, street musicians · ~25 min at a browse","note":"Royal is the Quarter’s handsome street — cast iron, art, no daiquiri shops. Ends you a few blocks from the hotel.","originalTime":"16:00"},{"t":"17:00","p":"nopsi","title":"Check in properly","cat":"hotel","where":"Unpack, shower, reset","note":"If the desk didn’t place you at bag drop, ask again — shift change means a different person.","originalTime":"17:00"},{"t":"17:45","p":"nopsi","title":"Drink at Above the Grid, the rooftop","status":"walk","cat":"bar","key":true,"where":"Top of the hotel · pool deck · skyline and Superdome views","note":"Optional first-night rooftop drink. Choose this or Lafitte’s if you feel fresh; leave time for dinner and the show.","originalTime":"17:45","spare":true},{"t":"18:15","p":"coops","title":"Dinner at Coop's Place","status":"walk","cat":"food","key":true,"where":"1109 Decatur · 11-min walk to Preservation Hall · no reservations, 21+","note":"Early dinner before Preservation Hall. If the queue would squeeze the show, choose another nearby meal. Check the current menu for non-seafood choices.","originalTime":"19:00","duration":90},{"t":"20:45","p":"preshall","title":"Preservation Hall","status":"book","cat":"music","key":true,"where":"726 St Peter · 15-min walk · 35–40 min set · tickets post ~mid-Oct","note":"Traditional jazz in a room standing since 1750. Malinda’s night. Non-refundable — grab the 8:45 when November opens.","originalTime":"20:45"},{"t":"21:45","p":"lafittes","title":"Lafitte’s Blacksmith Shop","status":"walk","cat":"bar","where":"941 Bourbon · 8-min walk · cash bar · piano in the back","note":"Optional after-show drink, not a commitment after an early flight. Choose this or the rooftop.","originalTime":"21:45","spare":true}]},{"id":"fri","label":"Friday","date":"2026-11-06","sub":"A house tour, Uptown lunch and architecture, then dinner and one show.","stay":"nopsi","stops":[{"t":"10:00","p":"hermann","title":"Hermann-Grima House","status":"book","cat":"see","key":true,"where":"12-min walk from NOPSI · guided, on the hour · ~45 min · $20","note":"The one house tour: an 1831 mansion, working open-hearth kitchen, stable, courtyard ironwork. Closed Tuesdays.","link":"https://hgghh.org","originalTime":"10:00"},{"t":"11:30","p":"pharmacy","title":"New Orleans Pharmacy Museum","status":"walk","cat":"see","where":"$10 · Tue–Sat 11–4 · 6-min walk · 30–40 min","note":"An optional alternative to the Uptown afternoon. Do not squeeze both museum and architecture tour around lunch.","originalTime":"11:30","spare":true},{"t":"12:00","p":"turkeywolf","title":"Lunch at Turkey and the Wolf","status":"walk","cat":"food","key":true,"where":"739 Jackson Ave · 10-min Lyft from the Pharmacy Museum · counter service, no reservations · Wed–Mon 11–4","note":"Lunch before the proposed Garden District walk. Leave travel time and confirm current opening hours.","originalTime":"13:30","duration":60},{"t":"16:30","p":"napoleon","title":"Napoleon House","status":"walk","cat":"bar","where":"500 Chartres · back in the Quarter · allow travel from Turkey and the Wolf","note":"Optional Quarter drink on a different free afternoon; skip the extra round trip before Dooky Chase’s.","originalTime":"16:30","spare":true},{"t":"19:30","p":"dooky","title":"Dooky Chase's","status":"book","cat":"food","key":true,"where":"OpenTable ~Oct 7 · dinner Fri & Sat only · $12 Lyft","note":"Leah Chase's Creole institution since 1941 — fried chicken, gumbo, red beans, the art on the walls.","link":"https://www.opentable.com","originalTime":"19:30"},{"t":"21:30","p":"chickie","title":"One live-music show — choose after checking listings","status":"book","cat":"music","key":true,"where":"6-min Lyft from Dooky Chase · small room · swamp blues","note":"Chickie Wah Wah is the proposed venue. Eric Lindell and alternative artist/date details are unconfirmed. Verify the actual November 6 lineup before buying tickets.","link":"https://www.chickiewahwah.com","alt":"bluenile","originalTime":"21:30"},{"t":"23:30","p":"washsq","title":"Bayou Bacchanal Pre Fete (optional)","status":"walk","cat":"event","where":"Wear white · Marigny","note":"Spare late-night idea only. Dinner and one confirmed music choice are enough for this evening.","originalTime":"23:30","spare":true},{"t":"16:00","title":"Hotel reset before dinner","p":"nopsi","cat":"hotel","duration":90,"note":"Return to NOPSI, put your feet up, and change before Dooky Chase’s.","status":"walk"}]},{"id":"sat","label":"Saturday","date":"2026-11-07","sub":"Brennan’s, the confirmed cemetery tour, and an unhurried birthday evening.","stay":"nopsi","stops":[{"t":"10:15","p":"brennans","title":"Brennan's","status":"booked","cat":"food","key":true,"where":"417 Royal · 12-min walk from NOPSI · the pink building · out by ~noon","note":"Eggs Hussarde and Bananas Foster are ideas from the original plan. Check current ingredients and non-seafood choices with the restaurant. The source records a $150 expected Sapphire Reserve dining credit; verify eligibility and the posted amount before treating it as a refund.","dress":"Collared shirt, long pants, closed shoes","originalTime":"10:15"},{"t":"12:15","p":"voodooauth","title":"Voodoo Authentica","status":"walk","cat":"see","key":true,"where":"12-min walk · run by initiated practitioners since 1996","note":"Optional Quarter browsing if there is time after Brennan’s. Protect the 4:15 p.m. cemetery check-in.","alt":"voodoomuseum","originalTime":"12:15","spare":true},{"t":"13:15","p":"washsq","title":"Bayou Bacchanal","status":"walk","cat":"event","where":"Festival ~11am–9pm · route posts ~1 wk out · 20-min walk from Dumaine","note":"Optional festival outing only after verifying the date and location. Leave enough time for the confirmed 4:15 p.m. cemetery check-in.","link":"https://friendsofculture.org","alt":"beignetfest","originalTime":"13:15","spare":true},{"t":"16:15","p":"basin","title":"St. Louis Cemetery No. 1 — check in 4:15","status":"booked","cat":"see","key":true,"where":"BOOKED · ref See private confirmation · tour 4:30pm, 2 adults, $62.50 · ARRIVE 4:15 for wristbands · Cemetery Tour Desk, Basin St. Statio }
// Standalone edition: state is local, backed up through Info.

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function place(id){ if(!id) return null; const p=PLACES[id]; return p?{id,...p}:null; }
function fmtT(t,tz){ if(!/^\d\d:\d\d$/.test(t)) return t; let [h,m]=t.split(':').map(Number); const ap=h>=12?'p':'a'; h=h%12||12; return `${h}:${String(m).padStart(2,'0')}${ap}${tz?' '+tz:''}`; }
function mins(t){ const [h,m]=t.split(':').map(Number); return (h<5?h+24:h)*60+m; } // 00:30 counts as late night of same day
let here=null; // {lat,lng,at}
function km(a,b){ const R=6371,dl=(b[0]-a[0])*Math.PI/180,dg=(b[1]-a[1])*Math.PI/180,x=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function distStr(ll){ if(!here||!ll) return ''; const d=km([here.lat,here.lng],ll); const mi=d*0.621; const walk=Math.round(d/5*60); return mi<0.1?'right here':`${mi.toFixed(1)} mi · ${walk<60?walk+' min walk':'take a car'}`; }
function mapBtns(p,cls=''){
  if(!p||!p.ll) return '';
  const [la,ln]=p.ll, q=encodeURIComponent(p.name), addr=encodeURIComponent(p.addr);
  return `<a class="btn ${cls}" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${la},${ln}&dirflg=w&q=${q}">Directions</a>
  <a class="btn ${cls}" target="_blank" rel="noopener" href="https://lyft.com/ride?id=lyft&destination[latitude]=${la}&destination[longitude]=${ln}">Lyft</a>
  <a class="btn ${cls}" target="_blank" rel="noopener" href="https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[latitude]=${la}&dropoff[longitude]=${ln}&dropoff[nickname]=${q}&dropoff[formatted_address]=${addr}">Uber</a>`;
}
function menuBtn(pid,cls=''){
  const p=place(pid); if(!p) return '';
  const M = (typeof MENUS!=='undefined') ? MENUS : {};
  const has = Object.prototype.hasOwnProperty.call(M,pid);
  // explicit null = this place publishes no menu online; show nothing rather
  // than a button that dumps you on a homepage or a scraped-menu site.
  if(has && !M[pid]) return '';

  if(!has && !(p.cat==='food'||p.cat==='bar')) return '';

}

function nowCT(){ const d=new Date(); const p=new Intl.DateTimeFormat('en-US',{timeZone:TRIP.tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'}).formatToParts(d); const o={}; p.forEach(x=>o[x.type]=x.value); return {date:`${o.year}-${o.month}-${o.day}`,hm:`${o.hour==='24'?'00':o.hour}:${o.minute}`,wd:o.weekday}; }
function tripDayIndex(){ const n=nowCT(); let i=DAYS.findIndex(d=>d.date===n.date); if(i<0){ // before 5am, still "last night"

const DOW={Su:0,Mo:1,Tu:2,We:3,Th:4,Fr:5,Sa:6};
function openState(oh){                       // -> {open:bool, txt:string} or null when unknown
  if(!oh) return null;
  const n=nowCT(); const wd=DOW[n.wd.slice(0,2)]; const cur=Number(n.hm.slice(0,2))*60+Number(n.hm.slice(3,5));
  let open=false, nextTxt='';
  oh.split(';').forEach(clause=>{
    const m=clause.trim().match(/^([A-Za-z]{2})(?:-([A-Za-z]{2}))?\s+(\d\d):(\d\d)-(\d\d):(\d\d)$/);
    if(!m) return;
    const a=DOW[m[1]], b=m[2]?DOW[m[2]]:a;
    const s1=Number(m[3])*60+Number(m[4]); let e1=Number(m[5])*60+Number(m[6]);
    const overnight=e1<=s1; if(overnight) e1+=1440;
    for(let d=0;d<7;d++){
      const inRange = a<=b ? (d>=a&&d<=b) : (d>=a||d<=b);
      if(!inRange) continue;
      // today's window
      if(d===wd && cur>=s1 && cur<e1) open=true;
      // yesterday's window spilling past midnight
      if(overnight && d===((wd+6)%7) && cur+1440>=s1 && cur+1440<e1) open=true;
      if(d===wd && cur<s1) nextTxt=nextTxt||('opens '+fmtT(m[3]+':'+m[4]));
    }
  });
  return {open, txt: open?'Open now':(nextTxt||'Closed now')};
}

<script>
// Register, and check for updates periodically. Deliberately no auto-reload:
// reloading a live page races init and leaves the tab bar dead until relaunch.
// The worker caches any newer shell, so it is picked up on the next open.
if("serviceWorker" in navigator){
  // updateViaCache:'none' — never let iOS serve a stale sw.js from its HTTP cache.
  navigator.serviceWorker.register("sw.js",{updateViaCache:'none'}).then(r=>{
    r.update();
    setInterval(()=>r.update(), 30*60*1000);
    // iOS "closes" a home-screen app by suspending it, so a relaunch is usually a
    // resume with no page load and no update check. Run the check on every
    // return to the foreground instead: re-check sw.js, and re-fetch the shell
    // through the worker so its compare-and-notify path runs.
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState!=='visible') return;
      r.update();
      fetch('index.html',{cache:'no-cache'}).catch(()=>{});
    });
  }).catch(()=>{});
  // The worker posts shell-updated only when the cached shell's bytes actually
  // changed. We show a bar and let the user tap — never auto-reload.
  // Track whether the user has started using this launch. If the fresh shell
  // lands before they've touched anything (the usual case on wifi), reload
  // quietly so the new version is just there. If they're already scrolling or
  // tapping, don't yank the page — show the bar and let them choose.
  let touched=false; const mark=()=>{touched=true;};
  ['pointerdown','touchstart','keydown','wheel','scroll'].forEach(ev=>addEventListener(ev,mark,{passive:true,once:true}));
  // One quiet reload per launch, ever. The flag is read once at boot and cleared,
  // so a second update in the same launch falls through to the bar instead of looping.
  let justReloaded=false;
  try{ justReloaded=sessionStorage.getItem('nola-refined-just-reloaded')==='1'; sessionStorage.removeItem('nola-refined-just-reloaded'); }catch(_){}
  navigator.serviceWorker.addEventListener('message', e=>{
    if(!(e.data && e.data.type==='shell-updated')) return;
    if(!touched && !justReloaded && performance.now()<4000){
      try{ sessionStorage.setItem('nola-refined-just-reloaded','1'); }catch(_){}
      location.reload(); return;
    }
    const u=document.getElementById('upd'); if(!u) return;
    u.classList.add('show');
    u.onclick=()=>{ u.textContent='Refreshing\u2026'; location.reload(); };
  });
}
</script>
